name: CI/CD  # GitHub Actions 워크플로우 이름

on:
  push:
    branches: ["main"]  # main 브랜치 push 시 실행

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest  # GitHub 제공 Ubuntu 환경

    steps:
      - name: Checkout
        uses: actions/checkout@v4  # 소스 코드 가져오기

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"  # Spring Boot 빌드를 위한 Java 설정

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew  # gradlew 실행 권한 부여

      - name: Build & Test
        run: ./gradlew clean build  # 프로젝트 빌드 및 테스트

      # Docker buildx 활성화 (캐시 및 멀티 플랫폼 빌드 지원)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub 로그인
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker 이미지 빌드 및 Push
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/backend:latest
            ${{ secrets.DOCKER_USERNAME }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # EC2 배포
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/app
            docker compose pull
            docker compose up -d
            docker image prune -f